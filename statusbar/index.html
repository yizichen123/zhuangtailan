<script type="module">
  const HUD_DEFAULT_SETTINGS = { targetFontSize: 15 };
  const HUD_STORAGE_KEY = 'shenhao-status-font-settings';
  let hudSettings = { ...HUD_DEFAULT_SETTINGS };

  function hudLocalStorage() {
    try {
      if (window.parent && window.parent !== window && window.parent.localStorage) return window.parent.localStorage;
    } catch (e) {}
    try { return window.localStorage; } catch (e) {}
    return null;
  }

  function loadStoredHudSettings() {
    try {
      const ls = hudLocalStorage();
      if (!ls) return null;
      const raw = ls.getItem(HUD_STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function persistHudSettings(settings) {
    try {
      const ls = hudLocalStorage();
      if (!ls) return;
      ls.setItem(HUD_STORAGE_KEY, JSON.stringify(settings));
    } catch (e) {}
  }

  function clampNumber(value, min, max, fallback) {
    const num = parseInt(value, 10);
    if (!Number.isFinite(num)) return fallback;
    return Math.max(min, Math.min(max, num));
  }

  function normalizeHudSettings(settings = {}) {
    return {
      targetFontSize: clampNumber(settings.targetFontSize, 12, 28, HUD_DEFAULT_SETTINGS.targetFontSize),
    };
  }

  function getHudSettingsStore() {
    if (window.CrossedZoneHudSettings) return window.CrossedZoneHudSettings;
    try {
      if (window.parent && window.parent.CrossedZoneHudSettings) return window.parent.CrossedZoneHudSettings;
    } catch (e) {}
    return null;
  }

  async function loadHudSettings() {
    const stored = loadStoredHudSettings();
    if (stored) {
      return normalizeHudSettings({ ...HUD_DEFAULT_SETTINGS, ...stored });
    }
    try {
      const store = getHudSettingsStore() || await Promise.race([
        waitGlobalInitialized('CrossedZoneHudSettings'),
        new Promise((_, reject) => setTimeout(() => reject(new Error('CrossedZoneHudSettings timeout')), 800)),
      ]);
      if (store && typeof store.getSettings === 'function') {
        return normalizeHudSettings({ ...HUD_DEFAULT_SETTINGS, ...store.getSettings() });
      }
    } catch (e) {
      console.warn('[HUD] 字体设置加载失败：', e && e.message || e);
    }
    return normalizeHudSettings(HUD_DEFAULT_SETTINGS);
  }

  function saveHudSettings(partial) {
    hudSettings = normalizeHudSettings({ ...hudSettings, ...(partial || {}) });
    persistHudSettings(hudSettings);
    try {
      const store = getHudSettingsStore();
      if (store && typeof store.saveSettings === 'function') store.saveSettings(hudSettings);
    } catch (e) {
      console.warn('[HUD] 字体设置保存失败：', e && e.message || e);
    }
    return hudSettings;
  }

  function applyHudSettings(settings) {
    hudSettings = normalizeHudSettings({ ...hudSettings, ...(settings || {}) });
    document.documentElement.style.setProperty('--target-font-size', `${hudSettings.targetFontSize}px`);
    $('#font-size-display').text(hudSettings.targetFontSize);
  }

  // V7.3: 新旧状态栏皮肤 0ms 无刷热切换（默认 'light40' 4.0 浅色新颜，支持一键切回 'classic' 经典暗金）
  const HUD_THEME_KEY = 'shenhao-hud-theme';
  function normalizeHudTheme(val) {
    return val === 'classic' ? 'classic' : 'light40';
  }
  function loadStoredHudTheme() {
    try {
      const ls = hudLocalStorage();
      if (!ls) return 'light40';
      return normalizeHudTheme(ls.getItem(HUD_THEME_KEY));
    } catch (e) { return 'light40'; }
  }
  function saveStoredHudTheme(theme) {
    try {
      const ls = hudLocalStorage();
      if (ls) ls.setItem(HUD_THEME_KEY, normalizeHudTheme(theme));
    } catch (e) {}
  }
  function broadcastHudTheme(next, userInitiated) {
    try {
      const hostWin = (window.parent && window.parent !== window) ? window.parent : window;
      if (hostWin && hostWin.document && hostWin.document.documentElement) {
        hostWin.document.documentElement.setAttribute('data-shenhao-theme', next);
      }
      if (hostWin && typeof hostWin.dispatchEvent === 'function' && typeof hostWin.CustomEvent === 'function') {
        hostWin.dispatchEvent(new hostWin.CustomEvent('shenhao-theme-change', {
          detail: { theme: next, source: 'statusbar', userInitiated: !!userInitiated }
        }));
      }
    } catch (e) {}
  }
  function applyHudTheme(theme) {
    const next = normalizeHudTheme(theme);
    const styleEl = document.getElementById('shn-theme-40-style');
    if (styleEl) styleEl.disabled = (next !== 'light40');
    const rootEl = document.getElementById('shenhao-status-root');
    if (rootEl) rootEl.setAttribute('data-hud-theme', next);
    const btn = document.getElementById('shn-theme-toggle-btn');
    if (btn) {
      btn.setAttribute('data-theme', next);
      btn.setAttribute('aria-pressed', String(next === 'light40'));
      btn.setAttribute('aria-label', next === 'light40' ? '当前浅色主题，点击切换暗金主题' : '当前暗金主题，点击切换浅色主题');
      btn.title = next === 'light40' ? '当前浅色皮肤（点击一键切换暗金）' : '当前暗金皮肤（点击一键切换浅色）';
    }
    try {
      const hostWin = (window.parent && window.parent !== window) ? window.parent : window;
      if (hostWin && hostWin.document && hostWin.document.documentElement) {
        hostWin.document.documentElement.setAttribute('data-shenhao-theme', next);
      }
    } catch (e) {}
    return next;
  }
  function bindHudThemeControl() {
    const btn = document.getElementById('shn-theme-toggle-btn');
    if (btn) {
      $(btn).off('click.shnTheme').on('click.shnTheme', function (e) {
        e.stopPropagation();
        const cur = normalizeHudTheme(document.getElementById('shenhao-status-root')?.getAttribute('data-hud-theme'));
        const pickEl = e.target && e.target.closest ? e.target.closest('[data-theme-pick]') : null;
        const picked = pickEl ? pickEl.getAttribute('data-theme-pick') : '';
        const next = (picked && picked !== cur) ? picked : (cur === 'light40' ? 'classic' : 'light40');
        applyHudTheme(next);
        saveStoredHudTheme(next);
        broadcastHudTheme(next, true);
        scheduleHudFit();
      });
    }
    const onThemeStorage = function (ev) {
      if (ev && ev.key === HUD_THEME_KEY) applyHudTheme(ev.newValue);
    };
    const onThemeCustom = function (ev) {
      const next = ev && ev.detail && ev.detail.theme;
      if (next) applyHudTheme(next);
    };
    window.addEventListener('storage', onThemeStorage);
    try {
      if (window.parent && window.parent !== window) {
        window.parent.addEventListener('storage', onThemeStorage);
        window.parent.addEventListener('shenhao-theme-change', onThemeCustom);
      }
    } catch (e) {}
    window.addEventListener('pagehide', function () {
      window.removeEventListener('storage', onThemeStorage);
      try {
        if (window.parent && window.parent !== window) {
          window.parent.removeEventListener('storage', onThemeStorage);
          window.parent.removeEventListener('shenhao-theme-change', onThemeCustom);
        }
      } catch (e) {}
    }, { once: true });
  }
  applyHudTheme(loadStoredHudTheme());

  function bindHudSettingsControls() {
    $('#font-dec').off('click').on('click', function (e) {
      e.stopPropagation();
      const next = clampNumber(hudSettings.targetFontSize - 1, 12, 28, 15);
      applyHudSettings({ targetFontSize: next });
      saveHudSettings({ targetFontSize: next });
      scheduleHudFit();
    });
    $('#font-inc').off('click').on('click', function (e) {
      e.stopPropagation();
      const next = clampNumber(hudSettings.targetFontSize + 1, 12, 28, 15);
      applyHudSettings({ targetFontSize: next });
      saveHudSettings({ targetFontSize: next });
      scheduleHudFit();
    });
  }

  function fitHudToActiveContent() {
    const hud = $('#hud-main');
    const contentArea = $('#content-area-main');
    const activePane = $('.tab-pane.active');

    const root = $('#shenhao-status-root');

    root.css({ height: 'auto', minHeight: '0', maxHeight: 'none', blockSize: 'auto', minBlockSize: '0', maxBlockSize: 'none' });
    hud.css({ height: 'auto', minHeight: '0', maxHeight: 'none', blockSize: 'auto', minBlockSize: '0', maxBlockSize: 'none', aspectRatio: 'auto' });
    contentArea.css({ height: 'auto', minHeight: '0', maxHeight: 'none', blockSize: 'auto', minBlockSize: '0', maxBlockSize: 'none' });
    activePane.css({ height: 'auto', minHeight: '0', maxHeight: 'none', blockSize: 'auto', minBlockSize: '0', maxBlockSize: 'none' });
  }

  function scheduleHudFit() {
    if (window.requestAnimationFrame) requestAnimationFrame(fitHudToActiveContent);
    setTimeout(fitHudToActiveContent, 80);
    setTimeout(fitHudToActiveContent, 250);
  }

  function adjustContainerRatio() {
    fitHudToActiveContent();
  }

  function formatMoney(num) {
    try { return ThomasEconomy.currencyMoney(getLatestStatData(),Number(num ?? 0)); } catch(error) { return '币种待核对'; }
  }

  function formatCashNumber(num) {
    return Number(num || 0).toLocaleString(undefined, {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  }

  function getQClass(q) {
    if (!q) return 'q-普通';
    return `q-${q}`;
  }

  function showModal(title, content) {
    $('#modal-title').html(title);
    $('#modal-body').html(content);
    $('#hud-modal').css('display', 'flex');
  }

  function cleanUserTerm(str) {
    if (!str) return str;
    return String(str).replace(/\buser\b/gi, '你');
  }

  function safeText(value, fallback = '暂无') {
    if (value === null || value === undefined) return fallback;
    const text = String(value).trim();
    return text ? cleanUserTerm(text) : fallback;
  }

  function safeAttr(value) {
    return safeText(value, '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 模型/玩家文本进 HTML 前统一转义（V1.6.4 起，个人信息与名望页使用）
  function escHtml(value) {
    return String(value ?? '').replace(/&/g, '\u0026amp;').replace(/</g, '\u0026lt;').replace(/>/g, '\u0026gt;').replace(/"/g, '\u0026quot;').replace(/'/g, '\u0026#39;');
  }

  function safeObject(value) {
    return value && typeof value === 'object' && !Array.isArray(value) ? value : {};

  function deriveWealthStatus(cashValue) {
    const cash = Number(cashValue) || 0;
    if (cash >= 100000000000) return { level: '顶级神豪', multiplier: 2 };
    if (cash >= 10000000000) return { level: '高级神豪', multiplier: 3 };
    if (cash >= 1000000000) return { level: '中级神豪', multiplier: 5 };
    if (cash >= 100000000) return { level: '初级神豪', multiplier: 8 };
    return { level: '萌新神豪', multiplier: 10 };

  }
  function shnBoundaryRowsHtml(rawText) {
    const txt = String(rawText == null ? '' : rawText).trim();
    if (!txt || txt === '无' || txt === '暂无') {
      return '<div class="shn-kv-row"><span class="shn-kv-k">界线与反感：</span><span class="shn-kv-v">无</span></div>';
    }
    const labelMap = {
      '不接受的': { key: 'forbid', label: '不接受的', cls: 'is-forbid' },
      '不接受': { key: 'forbid', label: '不接受的', cls: 'is-forbid' },
      '绝对不接受': { key: 'forbid', label: '不接受的', cls: 'is-forbid' },
      '不可接受': { key: 'forbid', label: '不接受的', cls: 'is-forbid' },
      '绝对雷区': { key: 'forbid', label: '不接受的', cls: 'is-forbid' },
      '雷区': { key: 'forbid', label: '不接受的', cls: 'is-forbid' },
      '底线': { key: 'forbid', label: '不接受的', cls: 'is-forbid' },
      '红线': { key: 'forbid', label: '不接受的', cls: 'is-forbid' },
      '越过会': { key: 'conseq', label: '越过会', cls: 'is-conseq' },
      '越界会': { key: 'conseq', label: '越过会', cls: 'is-conseq' },
      '越线会': { key: 'conseq', label: '越过会', cls: 'is-conseq' },
      '触碰会': { key: 'conseq', label: '越过会', cls: 'is-conseq' },
      '踩线会': { key: 'conseq', label: '越过会', cls: 'is-conseq' },
      '后果': { key: 'conseq', label: '越过会', cls: 'is-conseq' },
      '已让出': { key: 'yield', label: '已让出', cls: 'is-yield' },
      '已松动': { key: 'yield', label: '已让出', cls: 'is-yield' },
      '可让出': { key: 'yield', label: '已让出', cls: 'is-yield' },
      '已放宽': { key: 'yield', label: '已让出', cls: 'is-yield' },
      '已接受': { key: 'yield', label: '已让出', cls: 'is-yield' }
    };
    const re = /(?:^|[；;。\n|｜])\s*(?:[【「\[])?(不接受的|不接受|绝对不接受|不可接受|绝对雷区|雷区|底线|红线|越过会|越界会|越线会|触碰会|踩线会|后果|已让出|已松动|可让出|已放宽|已接受)(?:[】」\]])?\s*[:：]\s*/g;
    const hits = [];
    let m;
    while ((m = re.exec(txt)) !== null) {
      hits.push({ idx: m.index, end: re.lastIndex, rawLabel: m[1] });
    }
    if (!hits.length) {
      return '<div class="shn-kv-row"><span class="shn-kv-k">界线与反感：</span><span class="shn-kv-v">' + escHtml(txt) + '</span></div>';
    }
    const buckets = { forbid: [], conseq: [], yield: [] };
    const extra = [];
    const prefix = txt.slice(0, hits[0].idx).replace(/[；;。\s|｜]+$/g, '').trim();
    if (prefix) extra.push(prefix);
    for (let i = 0; i < hits.length; i++) {
      const h = hits[i];
      const nextIdx = i + 1 < hits.length ? hits[i + 1].idx : txt.length;
      const body = txt.slice(h.end, nextIdx).replace(/[；;。\s|｜]+$/g, '').trim();
      const meta = labelMap[h.rawLabel];
      if (meta && body) buckets[meta.key].push(body);
    }
    const rows = [];
    if (extra.length) {
      rows.push('<div class="shn-bd-row"><span class="shn-bd-tag">界线备注</span><span class="shn-bd-txt">' + escHtml(extra.join('；')) + '</span></div>');

      { key: 'forbid', label: '不接受的', cls: 'is-forbid' },
      { key: 'conseq', label: '越过会', cls: 'is-conseq' },
      { key: 'yield', label: '已让出', cls: 'is-yield' }
    ];
    for (let i = 0; i < order.length; i++) {
      const o = order[i];
      if (buckets[o.key].length) {
        rows.push('<div class="shn-bd-row ' + o.cls + '"><span class="shn-bd-tag">' + o.label + '</span><span class="shn-bd-txt">' + escHtml(buckets[o.key].join('；')) + '</span></div>');
      }
    }
    if (!rows.length) {
      return '<div class="shn-kv-row"><span class="shn-kv-k">界线与反感：</span><span class="shn-kv-v">' + escHtml(txt) + '</span></div>';
    }
    return '<div class="shn-bd-group">' + rows.join('') + '</div>';
  }
  function getLatestStatData() {
    const pickStat = source => {
      const direct = _.get(source, 'stat_data', null);
      if (direct && typeof direct === 'object' && !Array.isArray(direct)) return direct;
      const variableStat = _.get(source, 'variables.stat_data', null);
      if (variableStat && typeof variableStat === 'object' && !Array.isArray(variableStat)) return variableStat;
      const dataStat = _.get(source, 'data.stat_data', null);
      if (dataStat && typeof dataStat === 'object' && !Array.isArray(dataStat)) return dataStat;
      return null;
    };

    try {
      const read = typeof getVariables === 'function' ? getVariables : window.TavernHelper?.getVariables;
      if (typeof read === 'function') {
        const latestVariables = read({ type: 'message', message_id: 'latest' });
        const latestStat = pickStat(latestVariables);
        if (latestStat) return latestStat;
      }
    } catch (error) {
      console.warn('[status bar] latest message variables unavailable:', error);
    }

    try {
      const mvu = getHudMvu();
      if (typeof mvu?.getMvuData === 'function') {
        const latestMvuData = mvu.getMvuData({ type: 'message', message_id: 'latest' });
        const latestStat = pickStat(latestMvuData);
        if (latestStat) return latestStat;
      }
    } catch (error) {
      console.warn('[status bar] latest MVU data unavailable:', error);
    }

    try {
      const read = typeof getAllVariables === 'function' ? getAllVariables : window.TavernHelper?.getAllVariables;
      const mergedStat = typeof read === 'function' ? pickStat(read()) : null;
      if (mergedStat) return mergedStat;
    } catch (error) {
      console.warn('[status bar] merged variables unavailable:', error);
    }

    return {};
  }

  function cloneData(value) {
    try {
      return JSON.parse(JSON.stringify(value ?? {}));
    } catch (error) {
      console.warn('[status bar] clone failed:', error);
      return {};
    }
  }

  function deleteOwn(target, key) {
    if (!target || typeof target !== 'object') return false;
    if (!Object.prototype.hasOwnProperty.call(target, key)) return false;
    delete target[key];
    return true;
  }

  function normalizeAmountToken(token) {
    const raw = String(token || '').replace(/[,\s，]/g, '');
    const match = raw.match(/([+-]?\d+(?:\.\d+)?)(亿|万|千|k|K|w|W)?/);
    if (!match) return 0;
    const base = Number(match[1]);
    if (!Number.isFinite(base)) return 0;
    const unit = match[2] || '';
    const multiplier =
      unit === '亿' ? 100000000 :
      unit === '万' || unit === 'w' || unit === 'W' ? 10000 :
      unit === '千' || unit === 'k' || unit === 'K' ? 1000 :
      1;
    return Math.max(0, Math.round(base * multiplier));
  }

  function collectRewardAmount(text, patterns) {
    const source = String(text || '');
    let best = 0;
    patterns.forEach(pattern => {
      pattern.lastIndex = 0;
      let match;
      while ((match = pattern.exec(source))) {
        const value = normalizeAmountToken(match[1]);
        if (value > best) best = value;
      }
    });
    return best;
  }

  function parseRewardAmounts(rewardText) {
    let cash = collectRewardAmount(rewardText, [
      /(?:现金奖励|奖励现金|现金余额|人民币|现金)[^\d+-]{0,12}([+-]?\d[\d,，]*(?:\.\d+)?\s*(?:亿|万|千|k|K|w|W)?)/g,
      /([+-]?\d[\d,，]*(?:\.\d+)?\s*(?:亿|万|千|k|K|w|W)?)\s*(?:元|现金|人民币)/g,
    ]);
    const points = collectRewardAmount(rewardText, [
      /(?:系统积分|奖励积分|积分奖励|积分|点数)[^\d+-]{0,12}([+-]?\d[\d,，]*(?:\.\d+)?\s*(?:万|千|k|K|w|W)?)/g,
      /([+-]?\d[\d,，]*(?:\.\d+)?\s*(?:万|千|k|K|w|W)?)\s*(?:系统积分|积分|点)/g,
    ]);
    const foreign = [];
    const token = '([+-]?\\d[\\d,，]*(?:\\.\\d+)?\\s*(?:亿|万|千|k|K|w|W)?)';
    ThomasEconomy.currencies().filter(c => c.code !== 'CNY').forEach(c => {
      const unit = '(?:' + c.name + '|' + c.code + ')';
      const patterns = [new RegExp(token + '\\s*' + unit, 'g'),new RegExp(unit + '\\s*' + token, 'g')];
      patterns.forEach(pattern => { let match; while ((match=pattern.exec(String(rewardText||'')))) foreign.push(ThomasEconomy.baseAmount(getLatestStatData(),normalizeAmountToken(match[1]),c.code)); });
    });
    if(foreign.length)cash=Math.max(...foreign);
    return { cash, points };
  }

  function isTaskSettleReady(task) {
    const status = safeText(task?.状态, '');
    const progress = safeText(task?.进度, '');
    const combined = `${status} ${progress}`;
    if (/已结算|失败|放弃/.test(combined)) return false;
    return /可提交|待结算|已完成/.test(status);
  }

  let autoSettleInFlight = false;
  async function autoSettleReadyTasks() {
    if (autoSettleInFlight) return;
    autoSettleInFlight = true;
    try {
      const tasks = safeObject(getLatestStatData().user?.当前任务);
      const readyList = [];
      for (const [name, raw] of Object.entries(tasks)) {
        const t = safeObject(raw);
        if (!isTaskSettleReady(t)) continue;
        const parsed = parseRewardAmounts(safeText(t.报酬, ''));
        if (parsed.cash <= 0 && parsed.points <= 0) continue;
        readyList.push({ name: name, cash: parsed.cash, points: parsed.points });
      }
      if (!readyList.length) return;
      const settled = [];
      for (const it of readyList) {
        const ok = await settleTaskReward(it.name, { cash: it.cash, points: it.points, removeTask: true });
        if (ok) settled.push(it);
      }
      if (!settled.length) return;
      refreshTaskSettlementViews();
      notifyAutoSettle(settled);
    } catch (error) {
      console.warn('[HUD] auto settle failed:', error && error.message || error);
    } finally {
      autoSettleInFlight = false;
    }
  }

  function notifyAutoSettle(settled) {
    try {
      const totalCash = settled.reduce((s, x) => s + (x.cash || 0), 0);
      const totalPoints = settled.reduce((s, x) => s + (x.points || 0), 0);
      const names = settled.map(x => x.name).join('、');
      const msg = '已自动结算 ' + settled.length + ' 个任务：' + names + '｜+现金 ' + formatMoney(totalCash) + ' +积分 ' + totalPoints;
      if (typeof toastr !== 'undefined' && toastr && typeof toastr.success === 'function') {
        toastr.success(msg, '任务自动结算', { timeOut: 4000, extendedTimeOut: 1500 });
      } else {
        console.info('[HUD] ' + msg);
      }
    } catch (error) {
      console.warn('[HUD] notify auto settle failed:', error && error.message || error);
    }
  }

  async function settleTaskReward(taskName, options) {
    const cash = Math.max(0, Number(options?.cash) || 0);
    const points = Math.max(0, Number(options?.points) || 0);
    const removeTask = options?.removeTask !== false;

    return updateLatestStatData(stat => {
      if (!stat.user || typeof stat.user !== 'object') stat.user = {};
      const user = stat.user;
      if (!user.当前任务 || typeof user.当前任务 !== 'object' || Array.isArray(user.当前任务)) user.当前任务 = {};
      const task = user.当前任务[taskName];
      if (!task || typeof task !== 'object') return false;

      user.现金余额 = Math.max(0, Number(user.现金余额 || 0) + cash);
      user.系统积分 = Math.max(0, Math.round(Number(user.系统积分 || 0) + points));
      ThomasEconomy.derive(stat);

      if (removeTask) {
        delete user.当前任务[taskName];
      } else {
        task.状态 = '已结算';
        task.进度 = '已结算';
      }
      return true;
    });
  }

        <label class="settle-field">系统积分 <input class="settle-input" id="settle-points-input" inputmode="numeric" value="${safeAttr(parsed.points || 0)}"></label>

  function pickStatContainer(source) {
    if (!source || typeof source !== 'object') return null;
    if (source.stat_data && typeof source.stat_data === 'object') return { holder: source, key: 'stat_data' };
    if (source.variables?.stat_data && typeof source.variables.stat_data === 'object') return { holder: source.variables, key: 'stat_data' };
    if (source.data?.stat_data && typeof source.data.stat_data === 'object') return { holder: source.data, key: 'stat_data' };
    return null;
  }

  async function updateLatestStatData(mutator) {
    if (typeof mutator !== 'function') return false;

    try {
      if (window.Mvu && typeof Mvu.getMvuData === 'function' && typeof Mvu.replaceMvuData === 'function') {
        const mvuData = cloneData(Mvu.getMvuData({ type: 'message', message_id: 'latest' }) || {});
        const container = pickStatContainer(mvuData);
        if (container) {
          const nextStat = cloneData(container.holder[container.key]);
          const changed = mutator(nextStat);
          if (!changed) return false;
          container.holder[container.key] = nextStat;
          await Mvu.replaceMvuData(mvuData, { type: 'message', message_id: 'latest' });
          return true;
        }
      }
    } catch (error) {
      console.warn('[status bar] MVU write failed:', error);
    }

    try {
      if (typeof getVariables === 'function' && typeof replaceVariables === 'function') {
        const variables = cloneData(getVariables({ type: 'message', message_id: 'latest' }) || {});
        const container = pickStatContainer(variables) || { holder: variables, key: 'stat_data' };
        const nextStat = cloneData(container.holder[container.key] || getLatestStatData());
        const changed = mutator(nextStat);
        if (!changed) return false;
        container.holder[container.key] = nextStat;
        replaceVariables(variables, { type: 'message', message_id: 'latest' });
        return true;
      }
    } catch (error) {
      console.warn('[status bar] variables write failed:', error);
    }

    return false;
  }

  const CASH_UNITS = ['', '万', '亿', '兆', '京'];
  const CASH_CURRENCY_UNITS = { CNY:'元', USD:'美元', EUR:'欧元', GBP:'英镑', JPY:'日元', HKD:'港元', KRW:'韩元', RUB:'卢布' };
  const cashFormatter = new Intl.NumberFormat('zh-CN', { minimumFractionDigits:2, maximumFractionDigits:2 });
  const compactCashFormatter = new Intl.NumberFormat('zh-CN', { maximumFractionDigits:2 });
  let cashDisplay = null;
  let cashFitObserver;

  function fitCashBalance() {
    if (!cashDisplay) return;
    const amount = document.getElementById('wealth-amount');
    const cash = document.getElementById('s-cash');
    const unit = document.getElementById('s-cash-unit');
    const exact = document.getElementById('s-cash-exact');
    if (!amount || !cash || !unit || !exact) return;
    const available = amount.parentElement ? amount.parentElement.clientWidth : 0;
    const { value, full, currencyUnit } = cashDisplay;
    amount.removeAttribute('data-wrap');
    cash.textContent = full;
    unit.textContent = currencyUnit;
    let compact = false;
    if (available && Number.isFinite(value) && amount.scrollWidth > available) {
      const start = Math.min(CASH_UNITS.length - 1, Math.max(1, Math.floor(Math.log10(Math.abs(value)) / 4)));
      for (let index = start; index < CASH_UNITS.length; index++) {
        const scaled = value / 10 ** (4 * index);
        if (Math.abs(scaled) < 1) break;
        const rounded = Math.round(Math.abs(scaled) * 100) / 100;
        if (rounded >= 10000 && index + 1 < CASH_UNITS.length) continue;
        cash.textContent = compactCashFormatter.format(scaled);
        unit.textContent = CASH_UNITS[index] + currencyUnit;
        compact = true;
        if (amount.scrollWidth <= available) break;
      }
    }
    amount.toggleAttribute('data-wrap', Boolean(available && amount.scrollWidth > available));
    amount.toggleAttribute('data-compact', compact);
    amount.tabIndex = compact ? 0 : -1;
    amount.title = Number.isFinite(value) ? full + currencyUnit : '';
    exact.textContent = compact ? '完整金额 ' + full + currencyUnit : '';
    if (!compact) exact.hidden = true;
    if (compact) amount.setAttribute('aria-expanded', String(!exact.hidden));
    else amount.removeAttribute('aria-expanded');
  }

  function shnComputeRealmStage(lv) {
    const level = Math.max(0, Math.min(26, Math.round(Number(lv) || 0)));
    const name = SHN_REALM_NAMES[level] || '常人';
    if (level === 0) {
      return { lv: 0, name, stage: '凡俗', step: 0, total: 1, pct: 0, ready: false, peak: false, dantian: '未开窍', nextStage: '一品武者' };
    }
    if (level <= 9) {
      const step = level, total = 9, pct = Math.round((step / total) * 100), ready = level === 9;
      return { lv: level, name, stage: '武者境', step, total, pct, ready, peak: false, dantian: ready ? '九品圆满' : (step >= 5 ? '真气初生' : '内息初聚'), nextStage: '宗师·初期' };
    }
    if (level <= 13) {
      const step = level - 9, total = 4, pct = Math.round((step / total) * 100), ready = level === 13;
      return { lv: level, name, stage: '宗师境', step, total, pct, ready, peak: false, dantian: ready ? '宗师圆满' : '真气成型', nextStage: '大宗师·初期' };
    }
    if (level <= 17) {

      return { lv: level, name, stage: '大宗师境', step, total, pct, ready, peak: false, dantian: ready ? '大宗师圆满' : '真元浑厚', nextStage: '武尊·一阶' };
    }
    const step = level - 17, total = 9, pct = Math.round((step / total) * 100), peak = level === 26;

  function shnFillTavernInput(text) {

    if (!clean) return false;

      for (const doc of docs) {
        if (!doc) continue;
        const ta = doc.querySelector('#send_textarea');
        if (ta) {
          const prev = String(ta.value || '').trim();
          ta.value = prev ? (prev + '\n' + clean) : clean;
          ta.dispatchEvent(new Event('input', { bubbles: true }));
          ta.dispatchEvent(new Event('change', { bubbles: true }));
          try { ta.focus(); } catch (e) {}
          return true;
        }
      }
    } catch (e) {}
    try {
      const th = (window.parent && window.parent.TavernHelper) || window.TavernHelper;
      if (th && typeof th.triggerSlash === 'function') {
        th.triggerSlash('/setinput ' + clean.replace(/\|/g, '｜'));
        return true;
      }
    } catch (e) {}
    return false;
  }

  function renderReputation(reputation, fullStat) {
    const rep = safeObject(reputation);
    const value = Math.max(0, Math.min(9999, Number(rep.名望值) || 0));
    const tiers = [[0, '无名之辈'], [50, '小有名气'], [200, '崭露头角'], [500, '声名鹊起'], [1000, '名动一方'], [2000, '名震全国'], [4000, '名扬四海'], [7000, '时代风云']];
    let tierIndex = 0;
    for (let i = 0; i < tiers.length; i++) if (value >= tiers[i][0]) tierIndex = i;
    const baseTier = tiers[tierIndex];
    const nextTier = tiers[tierIndex + 1] || null;
    const span = nextTier ? (nextTier[0] - baseTier[0]) : 1;
    const progress = nextTier ? Math.max(0, Math.min(100, Math.round((value - baseTier[0]) / span * 100))) : 100;
    const remain = nextTier ? Math.max(0, nextTier[0] - value) : 0;

    // 名望阶梯：八段等宽，走过的是实心，当前段带游标，段内进度用 --rp-p
    const ladder = tiers.map(function (t, i) {
      if (i < tierIndex) return '<i data-done aria-hidden="true"></i>';
      if (i === tierIndex) return '<i data-cur style="--rp-p:' + progress + '%" aria-hidden="true"><b></b></i>';
      return '<i aria-hidden="true"></i>';
    }).join('');

    const CIRCLES = ['商界资本', '上流名门', '娱乐圈媒体', '市井网络', '体制官方'];
    const circleSource = safeObject(rep.圈层声望);
    const circleValues = CIRCLES.map(function (name) {

  function taskDateKey(str) {

  function cycleDateToDays(str) {
    const s = safeText(str, '');
    if (!s || s === '未知' || s === '无' || s === '从未' || s === '--') return null;
    let m = s.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
    if (m) {
      const t = Date.UTC(+m[1], +m[2] - 1, +m[3]);
      return Number.isFinite(t) ? Math.floor(t / 86400000) : null;
    }
    m = s.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
    if (m) {
      const t = Date.UTC(2026, +m[1] - 1, +m[2]);
      return Number.isFinite(t) ? Math.floor(t / 86400000) : null;
    }
    m = s.match(/(\d{4})\s*[-/.]\s*(\d{1,2})\s*[-/.]\s*(\d{1,2})/);
    if (m) {
      const t = Date.UTC(+m[1], +m[2] - 1, +m[3]);
      return Number.isFinite(t) ? Math.floor(t / 86400000) : null;
    }
    return null;
  }

            dueStr = safeText(f?.私密档案?.预产期, '');

      let cur = safeText(rec?.当前阶段, '');

      let remain = Number.isFinite(Number(rec?.距下一阶段天数)) ? Math.max(0, Math.round(Number(rec?.距下一阶段天数))) : null;

      if (!cur || !nxt || remain === null) {
        let h = 2166136261;
        const s = 'cycle#' + String(name || '');
        for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
        const Lv = 21 + ((h >>> 0) % 15);

        else if (initPhase === '黄体期') day = Math.min(Lv, Math.max(Ov + 2, Ov + 3));

        if (day <= Pv) { nxt = '安全期'; remain = Math.max(0, Pv + 1 - day); }
        else if (day < Ov - 2) { nxt = '排卵期'; remain = Math.max(0, (Ov - 2) - day); }
        else if (day <= Ov + 1) { nxt = '黄体期'; remain = Math.max(0, (Ov + 2) - day); }

      const tailText = remain > 0 ? (remain + '天后' + nxt) : ('今日进入' + nxt);

}

  function uterusStatusModel(raw) {

    const nums = String(profile.三围 || profile.threeSize || '').match(/[0-9]+(?:\.[0-9]+)?/g) || [];
    const avg = nums.length >= 3 ? nums.slice(0, 3).map(Number).reduce((a, b) => a + b, 0) / 3 : 78;
    const capacity = Math.max(3, Math.min(10, Math.round(3 + (avg - 60) * 7 / 45)));

  function shnPortraitSource(assets, name, variant) {
    if (!assets) return null;
    const keyOf = (v) => [encodeURIComponent(String(name || '').trim()), 'portrait', v].join('|');
    const pick = (v) => {
      const item = assets[keyOf(v)];
      if (!item || typeof item !== 'object') return null;
      const src = item.dataUrl || item.url || item.src || '';
      return (/^https?:\/\//i.test(src) || /^data:image\//i.test(src) || /^blob:/i.test(src)) ? src : null;
    };
    return (variant !== 'normal' && pick(variant)) || pick('normal') || null;
  }

  // V1.5.8 精确档位取图: 不回落正常档——手动轮询时无图即空图(1.5s IDB 回填器在该档图生成后自动补上)
  function shnPortraitExact(assets, name, variant) {
    if (!assets) return null;
    const item = assets[[encodeURIComponent(String(name || '').trim()), 'portrait', variant].join('|')];
    if (!item || typeof item !== 'object') return null;
    const s = item.dataUrl || item.url || item.src || '';
    return (/^https?:\/\//i.test(s) || /^data:image\//i.test(s) || /^blob:/i.test(s)) ? s : null;
  }
  function shnKeywordStage() {
    try {
      if (typeof getCurrentMessageId !== 'function' || typeof getChatMessages !== 'function') return '';
      const mid = getCurrentMessageId();
      if (shnMsgStage.done && shnMsgStage.id === mid) return shnMsgStage.stage;
      let stage = '';
      const msgs = getChatMessages(mid);
      const msg = Array.isArray(msgs) ? (msgs[0] || {}) : (msgs || {});
      const text = typeof msg.message === 'string' ? msg.message : '';
      if (text) {
        if (/事后|事毕|余韵|余温|云雨(之后|过后)|缠绵(之后|过后)|(高潮|激情|欢好)(过后|之后|渐息)|(呼吸|心跳|气息)[，,]?(渐趋|渐渐|逐渐)?平复|整理(衣物|裙摆|衬衫|衣衫)|穿(回|上)(内裤|衣物|衣服|裙子)/.test(text)) stage = 'aftermath';
        else if (/赤裸|裸体|裸裎|一丝不挂|寸缕不存|胴体|玉体|肌肤毕露|袒露|褪去|褪尽|脱[^。\n]{0,4}(裙|裤|衫|衣|袜|胸罩|内衣)|衣物落(地|下)|衣物?褪|扒(下|掉)[^。]{0,4}(衣|裙|裤|袜)|扯(下|掉|开)[^。]{0,6}(衣|裙|胸)/.test(text)) stage = 'nude';
        else if (/穿戴整齐|衣着(整洁|整齐|如常|完好|恢复)|恢复了?衣着|整装/.test(text)) stage = 'normal';
      }
      if (!stage && shnStageHold.id !== mid && (shnStageHold.stage === 'nude' || shnStageHold.stage === 'aftermath')) stage = shnStageHold.stage;
      if (stage) { shnStageHold.id = mid; shnStageHold.stage = stage; }
      shnMsgStage = { id: mid, done: true, stage };
      return stage;
    } catch (error) { return ''; }
  }

  // V1.5.7 判定优先级: 手动覆盖(放大视图切换) > 立绘字段(含中文值映射) > 关键词(粘滞+复位) > normal
function shnNormalizeStage(v) {
    const s = String(v || '').trim().toLowerCase();
    if (s === '正常' || s === 'normal') return 'normal';
    if (s === '赤裸' || s === '裸体' || s === 'nude') return 'nude';
    if (s === '事后' || s === 'aftermath') return 'aftermath';
    return s;
  }

  function shnPoseStorageKey() {

  function shnReadPoseMap() {
    let map = {};
    const cid = typeof shnResolveChatKey === 'function' ? shnResolveChatKey() : 'default';
    try {
      const scoped = localStorage.getItem(shnPoseStorageKey());
      const raw = scoped !== null ? scoped : localStorage.getItem(SHN_POSE_LS_KEY);
      if (raw) { const o = JSON.parse(raw); if (o && typeof o === 'object') map = o; }
    } catch (e) {}
    try {
      const wins = [window, window.parent, window.top];
      wins.forEach((w) => {
        if (!w) return;
        const bm = w.__shnPoseOverrideByChat && w.__shnPoseOverrideByChat[cid];
        if (bm && typeof bm === 'object') Object.assign(map, bm);
        else if (w.__shnPoseOverride && typeof w.__shnPoseOverride === 'object' && (!w.__shnPoseOverrideChatId || w.__shnPoseOverrideChatId === cid)) {
          Object.assign(map, w.__shnPoseOverride);
        }
      });
    } catch (e) {}
    return map;
  }
  function shnSetPoseOverride(name, val) {
    const nm = String(name || '').trim();
    if (!nm) return;
    const clean = String(val || '').trim();
    const cid = typeof shnResolveChatKey === 'function' ? shnResolveChatKey() : 'default';
    const map = shnReadPoseMap();
    if (clean) map[nm] = clean;
    else delete map[nm];
    try { localStorage.setItem(shnPoseStorageKey(), JSON.stringify(map)); } catch (e) {}
    try {
      const wins = [window, window.parent, window.top];
      wins.forEach((w) => {
        try {
          if (!w) return;
          const byChat = w.__shnPoseOverrideByChat || (w.__shnPoseOverrideByChat = {});
          byChat[cid] = Object.assign({}, map);
          w.__shnPoseOverrideChatId = cid;
          w.__shnPoseOverride = Object.assign({}, map);
        } catch (_) {}
      });
    } catch (e) {}
  }
  function shnPoseDrawerHtml(name, isMale) {
    const list = isMale ? SHN_POSE_PRESETS_M : SHN_POSE_PRESETS_F;

  function shnKeywordStageFor(stat, name, item, isMale) {
    if (item && item.衣着 && typeof item.衣着 === 'object') {
      const clStr = Object.values(item.衣着).join(' ');
      if (/赤裸|全裸|一丝不挂|裸体/.test(clStr)) return 'nude';
      if (/凌乱|半褪|事后/.test(clStr)) return 'aftermath';
    }
    if (isMale) return 'normal';
    try {
      if (typeof getCurrentMessageId !== 'function' || typeof getChatMessages !== 'function') return 'normal';
      const msgs = getChatMessages(getCurrentMessageId());
      const msg = Array.isArray(msgs) ? (msgs[0] || {}) : (msgs || {});
      const text = typeof msg.message === 'string' ? msg.message : '';
      if (!text) return 'normal';
      const activeCount = Object.keys(safeObject(stat && stat['当前在场互动女性'])).length + Object.keys(safeObject(stat && stat['当前在场互动男性'])).length;
      const cleanName = String(name || '').trim();
      const idx = cleanName ? text.indexOf(cleanName) : -1;
      if (activeCount > 1 && idx === -1) return 'normal';
      const scope = (activeCount > 1 && idx !== -1) ? text.slice(Math.max(0, idx - 150), idx + 150) : text;
      if (/事后|事毕|余韵|余温|云雨(之后|过后)|缠绵(之后|过后)|(高潮|激情|欢好)(过后|之后|渐息)|整理(衣物|裙摆|衬衫|衣衫)|穿(回|上)(内裤|衣物|衣服|裙子)/.test(scope)) return 'aftermath';
      if (/赤裸|裸体|裸裎|一丝不挂|寸缕不存|胴体|玉体|肌肤毕露|褪尽|脱[^。\n]{0,4}(裙|裤|衫|衣|袜|胸罩|内衣)|扒(下|掉)[^。\n]{0,4}(衣|裙|裤|袜)/.test(scope)) return 'nude';
    } catch (e) {}
    return 'normal';
  }
  function shnResolveVariant(stat, name) {
    const manual = shnVariantOverride[String(name || '').trim()];
    if (manual === 'normal' || manual === 'nude' || manual === 'aftermath') return manual;
    const femaleItem = stat['当前在场互动女性'] && stat['当前在场互动女性'][name];
    const maleItem = stat['当前在场互动男性'] && stat['当前在场互动男性'][name];
    const item = femaleItem || maleItem || null;
    const raw = item ? shnNormalizeStage(item['立绘'] || item['立绘状态'] || '') : '';
    if (raw === 'normal' || raw === 'nude' || raw === 'aftermath') return raw;
    return shnKeywordStageFor(stat, name, item, !!maleItem && !femaleItem) || 'normal';
  }

    });
  }

  function renderBDSM(bdsm) {
      var $c = $('#sw-bdsm-list');
      $c.empty();

      // ★ 兼容扁平结构（单层调教室，顶层有"名称"字段）
      var roomEntries;
      if (bdsm && typeof bdsm === 'object' && bdsm.名称) {
        roomEntries = [[bdsm.名称, bdsm]];
      } else {
        roomEntries = Object.entries(bdsm || {}).filter(function(e) {
          return e[1] && typeof e[1] === 'object';
        });
      }

      // ★ 始终显示，空状态时显示提示与筹建按钮
      if (roomEntries.length === 0) {
        $c.html('<div class="sw-empty">暂无调教室数据</div><div class="shn-bdsm-create-row" style="justify-content:center;"><button type="button" class="shn-bdsm-create-btn" id="btn-bdsm-create-room">+ 筹建新调教室</button></div>');
        $('#btn-bdsm-create-room').off('click').on('click', function() { shnOpenBdsmCreateModal(); });
        return;
      }

      var letters = ["A","B","C","D","E","F","G","H"];
      window._bdsmDataCache = {};

      function areaPosition(value) {
        if (value && typeof value === 'object') return safeText(value.坐标 || value.position, '');
        return safeText(value, '');
      }
      function areaDescription(value) {
        if (value && typeof value === 'object') return safeText(value.功能 || value.描述 || value.description, '');
        return safeText(value, '');
      }
      function positionCell(value) {
        var t = safeText(value, '').toUpperCase();
        var ms = t.match(/[A-H][1-8]/g);
        if (ms) return ms[ms.length-1];
        return '';
      }
      function gridSpec(gridSizeText) {
        var t = safeText(gridSizeText, '3x3');
        var ex = t.match(/([1-8])\s*[x×*]\s*([1-8])/i);
        if (ex) {
          var cols = Number(ex[1]), rows = Number(ex[2]);
          return { rows: rows, cols: cols, label: ex[1] + 'x' + ex[2] };
        }
        return { rows: 3, cols: 3, label: '3x3' };
      }
      function withinGrid(cell, spec) {
        var m = safeText(cell, '').toUpperCase().match(/^([A-H])([1-8])$/);
        if (!m || !spec) return true;
        var col = letters.indexOf(m[1]) + 1;
        var row = Number(m[2]);
        return col >= 1 && col <= spec.cols && row >= 1 && row <= spec.rows;
      }
      function findByCell(obj, cell, pick) {
        pick = pick || function(v) { return v; };
        return Object.entries(obj || {}).filter(function(e) {
          return positionCell(pick(e[1])) === cell;
        }).map(function(e) { return e[0]; });
      }
      function hasContent(areas, roles, tools) {
        return Object.keys(areas || {}).length > 0 || Object.keys(roles || {}).length > 0 || Object.keys(tools || {}).length > 0;
      }
      function outOfGridItems(areas, roles, tools, spec) {
        var rows = [];
        Object.entries(areas || {}).forEach(function(e) {
          var pos = areaPosition(e[1]), cell = positionCell(pos);
          if (cell && !withinGrid(cell, spec)) rows.push('区域 ' + e[0] + '：' + pos);
        });
        Object.entries(roles || {}).forEach(function(e) {
          var cell = positionCell(e[1]);
          if (cell && !withinGrid(cell, spec)) rows.push('角色 ' + e[0] + '：' + e[1]);
        });
        Object.entries(tools || {}).forEach(function(e) {
          var cell = positionCell(e[1]);
          if (cell && !withinGrid(cell, spec)) rows.push('用具 ' + e[0] + '：' + e[1]);
        });
        return rows;
      }

      function renderMap(room, roomKey) {
        var layout = safeObject(room.布局地图);
        var areas = layout.区域划分 || {};
        var roles = layout.角色坐标 || {};
        var tools = layout.用具坐标 || {};
        var targets = room.被调人员 || {};
        var logs = Object.entries(room.调教日志 || {}).slice(-3);
        var gridSizeText = layout.格子数 || '3x3';
        var spec = gridSpec(gridSizeText);
        var mapId = 'bdsm_' + Math.random().toString(36).substr(2, 9);
        window._bdsmDataCache[mapId] = { areas: areas, roles: roles, tools: tools, facilities: room.设施与用具 || {}, targets: targets, logs: logs, roomName: roomKey, spec: spec };

        var cells = [];
        for (var row = 1; row <= spec.rows; row++)
          for (var col = 0; col < spec.cols; col++)
            cells.push(letters[col] + row);

        var isEmpty = !hasContent(areas, roles, tools);
        var html = '<div class="sw-map-box">';
        html += '<div class="sw-grid-title">' + spec.label + ' · ' + (layout.房间尺寸 || '未知尺寸') + '</div>';
        html += '<div class="sw-map-grid" style="grid-template-columns:repeat(' + spec.cols + ',1fr); grid-template-rows:repeat(' + spec.rows + ',1fr); max-width:' + Math.min(420, 86 * spec.cols) + 'px;">';
        cells.forEach(function(d) {
          var areaNames = findByCell(areas, d, areaPosition);
          var roleNames = findByCell(roles, d, function(v) { return v; });
          var toolNames = findByCell(tools, d, function(v) { return v; });
          var cls = roleNames.length ? 'sw-m-cell-active' : toolNames.length ? 'sw-m-cell-tool' : '';
          var content = areaNames.map(function(x) { return '<span style="color:#2dd4bf;font-size:12px;">' + escHtml(x) + '</span>'; }).join('')
            + roleNames.map(function(x) { return '<span style="color:#E72D48;font-size:12px;">' + escHtml(x) + '</span>'; }).join('')
            + toolNames.map(function(x) { return '<span style="color:#facc15;font-size:12px;">' + escHtml(x) + '</span>'; }).join('');
          html += '<div class="sw-m-cell ' + cls + ' sw-bdsm-cell-btn" data-mapid="' + mapId + '" data-dir="' + d + '" title="点击查看详情"><b>' + d + '</b>' + (content || '<span style="opacity:.35">--</span>') + '</div>';
        });
        html += '</div>';
        if (isEmpty) html += '<div class="sw-grid-empty">暂无登记内容</div>';
        var outRows = outOfGridItems(areas, roles, tools, spec);
        if (outRows.length) html += '<div class="sw-grid-empty" style="color:#ff9b9b;">坐标超出当前网格：' + outRows.join('；') + '</div>';
        html += '</div>';

        html += '<div class="sw-card" style="margin-top:10px;font-size:14px;line-height:1.8;">';
        html += '<div class="sw-card-title"><span>区域明细</span></div>';
        if (Object.keys(areas).length) {
          Object.entries(areas).forEach(function(e) {
            var k = e[0], v = e[1];
            var pos = areaPosition(v), desc = areaDescription(v), cell = positionCell(pos);
            var posHtml = cell ? '<span style="color:#2dd4bf;">[' + cell + ']</span> ' : '';
            var outHtml = cell && !withinGrid(cell, spec) ? '<span style="color:#ff8080"> 坐标超出网格</span> ' : '';
            html += '<div><span style="color:#facc15;">' + escHtml(k) + '</span>：' + posHtml + outHtml + (desc ? escHtml(desc) : '<span style="color:#889;">暂无功能说明</span>') + '</div>';
          });
        } else {
          html += '<div style="color:#889;">暂无区域划分</div>';
        }
        html += '</div>';
        return html;
      }

      // ★ 设施渲染：兼容字符串值和对象值
      function renderFacilities(obj) {
        var entries = Object.entries(safeObject(obj));
        if (!entries.length) return '<div class="sw-empty">暂无设施</div>';

      function renderTargets(obj) {

      // ★ 环境配置渲染：遍历所有键值对
      function renderEnv(env) {

        var monitorEntries = Object.entries(monitor);

  function prepareHudTargetDetails() {
    const openCards = window.__shnOpenTargetCards || {};
    document.querySelectorAll('#render-targets .char-card[data-shn-name]').forEach((card, index) => {
      const details = card.querySelector(':scope > .collapse-body');
      const heading = card.querySelector('.shn-head');
      if (!details || !heading) return;

      const name = card.dataset.shnName;
      details.id = 'shenhao-target-details-' + index;
      details.classList.add('shn-target-detail');
      details.setAttribute('aria-labelledby', details.id + '-title');
      details.setAttribute('role', 'region');
      if (!details.querySelector('.shn-target-detail-head')) {
        details.insertAdjacentHTML('afterbegin', '<div class="shn-target-detail-head">'
          + '<h3 id="' + details.id + '-title">人物详情</h3>'
          + '<button type="button" class="shn-target-detail-close" data-target-detail-close>收起</button>'
          + '</div>');
      }

      let toggle = heading.querySelector('.shn-target-detail-toggle');
      if (!toggle) {
        toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'shn-target-detail-toggle';
        toggle.setAttribute('aria-controls', details.id);
        toggle.setAttribute('aria-label', name + '的人物详情');
        heading.append(toggle);
      }
      const open = Object.hasOwn(openCards, name) && openCards[name] === true;
      setHudTargetDetailState(card, open);
      if (open) $(details).show();
    });
  }

  function setHudTargetDetailState(card, open) {
    const toggle = card.querySelector('.shn-target-detail-toggle');
    if (!toggle) return;
    toggle.setAttribute('aria-expanded', String(open));
    toggle.textContent = open ? '收起详情' : '查看详情';
  }

  function toggleHudTargetDetail(event) {
    const panel = this.querySelector(':scope > .shn-target-detail');
    const toggle = this.querySelector('.shn-target-detail-toggle');
    if (!panel || !toggle) return;

    const close = event.target.closest('[data-target-detail-close]');
    if (!close && (panel.contains(event.target) || event.target.closest('button:not(.shn-target-detail-toggle), input, select, textarea, a'))) return;

    const open = !close && toggle.getAttribute('aria-expanded') !== 'true';
    const openCards = (window.__shnOpenTargetCards ||= Object.create(null));
    const name = this.dataset.shnName;
    if (open) Object.defineProperty(openCards, name, { value: true, configurable: true, enumerable: true });
    else delete openCards[name];

    $(panel).toggle(open);
    setHudTargetDetailState(this, open);
    scheduleHudFit();
    if (close) toggle.focus({ preventScroll: true });
  }

  function renderActiveTargets(females, males) {
    function companions(list) {

  const shnRedrawState = new Map();
  function shnVariantText(v) { return {normal:'正常',nude:'赤裸',aftermath:'事后'}[v] || '正常'; }
  // V1.6.3：卡片上的重绘入口收成一个 30px 圆钮，状态直接画在钮上（… / ✓ / !），
  // 进度文案留在 aria-live 的 .shn-redraw-note 里给读屏器，不占版面。
  function shnPaintPortraitActions() {
    document.querySelectorAll('#render-targets .shn-portrait-column').forEach(column => {
      const card = column.closest('[data-shn-name]'), img = column.querySelector('img[data-shn-img-key]');
      const button = column.querySelector('.shn-redraw'), note = column.querySelector('.shn-redraw-note');
      if (!card || !img || !button || !note) return;
      const name = card.getAttribute('data-shn-name'), variant = img.getAttribute('data-shn-img-key').split('|').at(-1);
      const state = shnRedrawState.get(JSON.stringify([name, variant]));
      button.disabled = !!(state && state.busy);
      button.textContent = state ? (state.busy ? '…' : (state.bad ? '!' : '✓')) : '⟳';
      button.setAttribute('aria-busy', String(button.disabled));
      button.setAttribute('aria-label', name + '，' + shnVariantText(variant) + '立绘，点了重新生成');
      button.title = '重绘' + shnVariantText(variant) + '立绘' + (state && state.text ? '（' + state.text + '）' : '');
      button.toggleAttribute('data-bad', !!(state && state.bad));
      button.toggleAttribute('data-ok', !!(state && !state.bad && !state.busy));
      note.textContent = state ? state.text : '';
      note.toggleAttribute('data-error', !!(state && state.bad));
    });
  }
  // 重绘动作抽出来，卡片圆钮和放大图里的按钮共用
  async function shnRedrawPortrait(name, variant, refresh) {
    const key = JSON.stringify([name, variant]);
    if (shnRedrawState.get(key)?.busy) return;
    const state = {busy:true, text:'已排队，正在重绘…', bad:false};
    shnRedrawState.set(key, state);
    shnPaintPortraitActions();
    try {
      const bridge = typeof shnFindMediaBridge === 'function' ? shnFindMediaBridge() : null;
      if (!bridge || typeof bridge.generateRole !== 'function') throw new Error('人物生图入口尚未就绪，请刷新小手机脚本后重试');
      const saved = await bridge.generateRole({name, slot:'portrait', variant});
      state.text = saved && saved.applied === false ? (saved.applyError || '新图已保存，未应用') : '新图已应用，旧图已保留';
      state.bad = !!(saved && saved.applied === false);
      shnApplyIdbPortraits();
    } catch (error) { state.text = (error && error.message) || '重绘失败，旧图已保留'; state.bad = true; }
    finally {
      state.busy = false;
      shnPaintPortraitActions();
      if (typeof refresh === 'function') refresh();
      setTimeout(() => {
        const cur = shnRedrawState.get(key);
        if (!cur || cur !== state) return;
        shnRedrawState.delete(key);
        shnPaintPortraitActions();
      }, 4200);
    }
  }
  function shnMountPortraitAction(card, name, slot) {
    if (slot.parentElement.classList.contains('shn-portrait-column')) return;
    const column = document.createElement('div'); column.className = 'shn-portrait-column';
    slot.parentNode.insertBefore(column, slot); column.appendChild(slot);
    const button = document.createElement('button'); button.type = 'button'; button.className = 'shn-redraw'; button.textContent = '⟳';
    button.setAttribute('aria-label', name + '立绘，点了重新生成');
    button.title = '重绘立绘';
    const note = document.createElement('span'); note.className = 'shn-redraw-note'; note.setAttribute('role', 'status'); note.setAttribute('aria-live', 'polite');
    column.appendChild(button); column.appendChild(note);
    button.addEventListener('click', event => {
      event.preventDefault(); event.stopPropagation();
      const img = slot.querySelector('img[data-shn-img-key]');
      const variant = img ? img.getAttribute('data-shn-img-key').split('|').at(-1) : 'normal';
      shnRedrawPortrait(name, variant);
    });
  }

  function applyTargetPortraits() {
    const wrap = document.getElementById('render-targets');
    if (!wrap) return;
    const cards = wrap.querySelectorAll('.char-card[data-shn-name]');
    if (!cards.length) return;
    const assets = shnReadMediaAssets();
    if (!assets) shnPortraitRetry();
    const stat = getLatestStatData() || {};
    cards.forEach((card) => {
      const name = card.getAttribute('data-shn-name');
      const slot = card.querySelector('.shn-pfp');
      if (!slot || !name) return;
      const variant = shnResolveVariant(stat, name);
      const manualOn = ['normal', 'nude', 'aftermath'].indexOf(shnVariantOverride[String(name || '').trim()]) >= 0;
      const src = manualOn ? shnPortraitExact(assets, name, variant) : shnPortraitSource(assets, name, variant);
      if (!card.querySelector('.shn-portrait-img')) {
        slot.textContent = '';
        const hint = document.createElement('span');
        hint.className = 'shn-pfp-hint';
        hint.textContent = src ? '立绘加载中' : '暂无立绘';
        const img = document.createElement('img');
        img.className = 'shn-portrait-img';
        img.style.opacity = '0';
        img.setAttribute('data-shn-img-key', name + '|portrait|' + variant);
        img.loading = 'lazy';
        img.decoding = 'async';
        img.alt = name + '立绘';
        img.addEventListener('load', () => { img.style.opacity = '1'; hint.hidden = true; });
        img.addEventListener('error', () => { img.style.opacity = '0'; hint.hidden = false; hint.textContent = '立绘暂不可用'; });
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function (event) {
          event.stopPropagation();
          event.preventDefault();
          if (!img.getAttribute('src') || !img.naturalWidth) return;
          shnLbTargetImg = img;
          shnOpenLightbox(img.currentSrc || img.src, name, variant);
        });
        const badge = document.createElement('span');
        badge.className = 'shn-variant shn-variant-' + variant;
        badge.textContent = variant === 'nude' ? '赤裸' : (variant === 'aftermath' ? '事后' : '正常');
        slot.appendChild(hint);
        slot.appendChild(img);
        slot.appendChild(badge);
        if (src) img.src = src;
      }
      shnMountPortraitAction(card, name, slot);
      shnAiAttachControls(card, name, variant, !!src || !!card.querySelector('.shn-portrait-img'));
    });
    shnPaintPortraitActions();
  }

  // ===== 立绘放大查看（V1.4.6）：点击立绘全屏查看，右上角半透明 × / 点背景 / Esc 关闭 =====
  let shnLbTargetImg = null; // V1.5.7 当前放大的立绘元素,轮询切换时同步更新主显示
  function shnCloseLightbox() {

        if (hit && this.getAttribute('data-own-asset') === '1') matchedOwn = true;
      });
      selectedOwnAsset = matchedOwn;
      $('#party-err').removeClass('is-show').text('');
    });

    $('[data-party-name]').off('click').on('click', function () {
      const nm = String(this.getAttribute('data-party-name') || '');
      $('#party-err').removeClass('is-show').text('');
      if (selected.has(nm)) {
        selected.delete(nm);
        $(this).removeClass('is-on');
      } else {
        if (selected.size >= 4) {
          $('#party-err').addClass('is-show').text('单次组局最多选择 4 位角色，避免场面失焦');
          return;
        }
        selected.add(nm);
        $(this).addClass('is-on');
      }
      updateTension();
    });

    $('#party-go-btn').off('click').on('click', () => {
      const place = String($('#party-place-input').val() || '').trim();
      if (!place) {
        $('#party-err').addClass('is-show').text('请选择名下资产或输入想去的地方');
        return;
      }
      const picks = people.filter((p) => selected.has(p.n));
      if (!picks.length) {
        $('#party-err').addClass('is-show').text('请至少选择 1 位受邀角色');
        return;
      }
      const theme = String($('#party-theme-input').val() || '').trim();
      const guestLines = picks.map((p) => {
        const b = bonds[p.n];
        const bText = b && (b.petName || b.note)
          ? ('，专属羁绊：' + [b.petName ? ('私下称呼「' + b.petName + '」') : '', b.note || ''].filter(Boolean).join('；'))
          : '';
        return p.n + '（' + safeText(p.与user的关系, p.rel) + '，好感' + (Number(p.好感度) || 0) + '/堕落' + (Number(p.堕落值) || 0) + (activeMap[p.n] ? '，已在场' : '，受邀赴约到场') + bText + '）';
      }).join('；');
      const classes = [...new Set(picks.map((p) => p.rel))];
      const mood = picks.length >= 2
        ? (classes.length >= 2 ? '多人跨身份同场齐聚，请重点刻画她们彼此打量、暗中争宠与微妙的修罗场氛围。' : '多位佳人同场相聚，请自然展开互动与微妙攀比。')
        : '两人独处赴约，请自然展开私密互动。';
      const placeDesc = selectedOwnAsset ? ('名下资产「' + place + '」') : ('「' + place + '」');
      const promptText = '【神豪私人组局邀约】我在' + placeDesc + (theme ? ('设下「' + theme + '」私人局') : '设下私人局') + '，邀请以下人物共聚：' + guestLines + '。' + mood;
      shnCloseRealmModal();
      const filled = shnFillTavernInput(promptText);
      if (!filled) openConfirmDialog('组局引子已生成，请复制发送：\n' + promptText, null);
    });
  }

  function renderRelationshipArchive(harem, activeFemales, trackingEvents, femaleArchives) {
    archiveLastArgs = { harem, activeFemales, trackingEvents, femaleArchives };
    const mergedHarem = { ...(harem || {}) };

    Object.entries(activeFemales || {}).forEach(([name, info]) => {
      const affinity = Number(info.好感度 || 0);
      const corruption = Number(info.堕落值 || 0);
      if ((affinity >= 60 || corruption >= 60) && !mergedHarem[name]) {
        mergedHarem[name] = {
          年龄: info.年龄 || '未知',
          与user的关系: info.与user的关系 || '未知',
          好感度: affinity,
          堕落值: corruption,
          颜值评分: info.颜值评分 || 0
        };
      }
    });

    const tracking = safeObject(trackingEvents);
    function getTracking(name) {
      const match = Object.values(tracking).find(e => safeObject(e).角色 === name);
      return match ? safeObject(match) : null;
    }

    if (Object.keys(mergedHarem).length === 0) {
      $('#render-archive').html('<div class="empty-state">后宫档案为空</div>');
      return;
    }

    const people = Object.entries(mergedHarem).map(([k, h_data]) => {
      const rt = activeFemales?.[k];
      const d = rt ? { ...h_data, ...rt } : h_data;
      return { n: k, ...d, rel: archiveRelClass(d.与user的关系) };
    }).sort((a, b) => Number(b.好感度 || 0) - Number(a.好感度 || 0));

    const counts = { 全部: people.length };
    ARCHIVE_REL_ORDER.forEach(c => { counts[c] = people.filter(p => p.rel === c).length; });
    const filter = counts[archiveRelFilter] !== undefined ? archiveRelFilter : '全部';
    const inFilter = filter === '全部' ? people : people.filter(p => p.rel === filter);
    const allBonds = shnReadAllBonds();
    const limit = filter === '全部' ? 8 : 12;
    const shown = archiveShowAll ? inFilter : inFilter.slice(0, limit);
    const hidden = inFilter.length - shown.length;

    function rowOf(f) {
      const tone = ARCHIVE_REL_TONES[f.rel] || '#8b8f98';
      const t = getTracking(f.n);
      let pregLine = '';
      if (t) {
        const st = t.当前状态 || '';
        const isPreg = ['已确认怀孕', '孕期推进', '临产待处理'].includes(st);
        const isSuspect = st === '疑似观察';
        const label = isPreg ? '是' : (isSuspect ? '疑似' : '否');
        const prob = t.怀孕几率 || '0%';
        const lastDate = (activeFemales?.[f.n]?.私密档案?.上次内射时间) || (femaleArchives?.[f.n]?.私密档案?.上次内射时间) || (t && t.发生日期) || '从未';
        const note = t.处理备注 || '';
        pregLine = '<div class="ar-line3"><span class="ar-preg' + (isPreg ? ' is-yes' : '') + '">怀孕 ' + safeText(label) + '</span>'
          + '<span>几率 ' + safeText(prob) + '</span><span>上次 ' + safeText(lastDate) + '</span>'
          + (note ? '<span class="ar-note">' + safeText(note) + '</span>' : '') + '</div>';
      }
      const bond = allBonds[f.n];
      const bondLine = bond && (bond.petName || bond.note)
        ? '<div class="ar-bond-line">'
          + (bond.petName ? '<span>专属称呼 <b>' + escHtml(bond.petName) + '</b></span>' : '')
          + (bond.note ? '<span>' + escHtml(bond.note) + '</span>' : '')
          + '</div>'
        : '';
      return `<div class="ar-row" style="--tone:${tone}">
        <span class="ar-bar" aria-hidden="true"></span>
        <div class="ar-main">
          <div class="ar-line1"><span class="ar-name">${safeText(f.n)}</span><span class="ar-rel">${safeText(f.与user的关系)}</span><span class="ar-cls">${safeText(f.rel)}</span></div>
          <div class="ar-line2"><span>好感 <b>${f.好感度}</b></span><span>堕落 <b class="q-特殊">${f.堕落值}</b></span><span>${shnArchiveAgeText(f.n, f)}</span><span data-npc-measurements>${npcMeasurementRows(getLatestStatData(), f.n, 'female').map(([label, value]) => label + ' ' + value).join(' · ')}</span></div>
          ${pregLine}
          ${bondLine}
        </div>
        <div class="ar-side"><span class="ar-star">★${f.颜值评分}</span><button type="button" class="archive-bond-btn" data-bond-name="${safeAttr(f.n)}" data-bond-rel="${safeAttr(safeText(f.与user的关系))}">羁绊</button><button type="button" class="archive-delete-btn" data-name="${safeAttr(f.n)}">休了她</button></div>
      </div>`;
    }

    let h = '<div class="ar-chips">';
    ['全部', ...ARCHIVE_REL_ORDER].forEach(c => {
      if (c !== '全部' && !counts[c]) return;
      h += `<button type="button" class="ar-chip" data-archive-filter="${safeAttr(c)}" aria-pressed="${filter === c}">${safeText(c)} <b>${counts[c]}</b></button>`;
    });
    h += '<button type="button" class="ar-party-btn" id="btn-archive-party">组局邀约</button>';
    h += '</div>';
    if (!shown.length) {
      h += '<div class="empty-state">这一档还没有人</div>';
    } else {
      h += shown.map(rowOf).join('');
    }
    if (hidden > 0) {
      h += `<button type="button" class="ar-more" data-archive-more="1">还有 ${hidden} 人 · 点开看全部 <b style="margin-left:auto">›</b></button>`;
    }
    h += `<div class="ar-foot">${filter === '全部' ? '按好感排序' : safeText(filter) + ' · ' + inFilter.length + ' 人'} · 当前显示 ${shown.length}/${inFilter.length} 人</div>`;

    $('#render-archive').html(h);
    $('#render-archive [data-archive-filter]').off('click').on('click', function() {
      const next = String(this.getAttribute('data-archive-filter') || '全部');
      if (next === archiveRelFilter) return;
      archiveRelFilter = next; archiveShowAll = false; archiveRerender();
    });
    $('#render-archive [data-archive-more]').off('click').on('click', function() {
      archiveShowAll = true; archiveRerender();
    });
    $('#btn-archive-party').off('click').on('click', function() {
      shnOpenPartyModal(people, activeFemales);
    });
    $('#render-archive [data-bond-name]').off('click').on('click', function(event) {
      event.stopPropagation();
      const bName = String(this.getAttribute('data-bond-name') || '');
      const bRel = String(this.getAttribute('data-bond-rel') || '');
      if (bName) shnOpenBondModal(bName, bRel);
    });
    $('.archive-delete-btn').off('click').on('click', async function(event) {
      event.stopPropagation();
      const name = String(this.getAttribute('data-name') || '');
      if (!name) return;
      const v = getLatestStatData();
      if (v.当前在场互动女性 && v.当前在场互动女性[name]) {
        openConfirmDialog('「' + name + '」当前在场，无法休弃', null);
        return;
      }
      openConfirmDialog('确定休了「' + name + '」吗？', async () => {
        const changed = await updateLatestStatData(stat => deleteOwn(stat.后宫状态, name));
        if (!changed) {
          openConfirmDialog('未能写回变量：当前预览环境可能不支持直接修改。', null);
          return;
        }
        const next = getLatestStatData();
        renderRelationshipArchive(next.后宫状态, next.当前在场互动女性, next.角色追踪事件);
        scheduleHudFit();
      });
    });
    bindHudInteractions();
  }

  function getHudMvu() {
    return typeof Mvu !== 'undefined' ? Mvu : window.Mvu;
  }

  async function waitOptionalGlobal(name, timeout = 1200) {
    if (window[name]) return window[name];
    try {
      if (typeof waitGlobalInitialized === 'function') {
        await Promise.race([
          waitGlobalInitialized(name),
          new Promise(resolve => setTimeout(resolve, timeout)),
        ]);
      }
    } catch (error) {
      console.warn('[HUD] optional global unavailable:', name, error && error.message || error);
    }
    return window[name] || null;
  }

  function bindHudInteractions() {
    $('.collapse-header').off('click').on('click', function () {
      $(this).next('.collapse-body').slideToggle(300, scheduleHudFit);
    });

    $('#render-targets .char-card').off('click').on('click', toggleHudTargetDetail);

    $('.shn-pose-apply').off('click').on('click', function (e) {
      e.stopPropagation();
      const nm = String($(this).attr('data-pose-name') || '').trim();
      const v = String($(this).closest('.shn-pose-row').find('.shn-pose-in').val() || '').trim();
      shnSetPoseOverride(nm, v);
      const $b = $(this);
      $b.addClass('shn-pose-press');
      setTimeout(function () { $b.removeClass('shn-pose-press'); }, 140);
      const oldT = $b.data('shnPoseT');
      if (oldT) clearTimeout(oldT);
      $b.addClass('shn-pose-ok').text('已应用');
      $b.data('shnPoseT', setTimeout(function () { $b.removeClass('shn-pose-ok').text('应用'); }, 2000));
    });
    $('.shn-pose-clear').off('click').on('click', function (e) {
      e.stopPropagation();
      const nm = String($(this).attr('data-pose-name') || '').trim();
      shnSetPoseOverride(nm, '');
      $(this).closest('.shn-pose-row').find('.shn-pose-in').val('');
    });
    $('.shn-pose-lib-btn').off('click').on('click', function (e) {
      e.stopPropagation();
      const $dr = $(this).closest('.shn-sub-sec').find('.shn-pose-drawer');
      const open = !$dr.hasClass('is-open');
      $dr.toggleClass('is-open', open);
      $(this).text(open ? '姿势库 ▴' : '姿势库 ▾');
      scheduleHudFit();
    });
    $('.shn-pose-chip').off('click').on('click', function (e) {
      e.stopPropagation();
      const nm = String($(this).attr('data-pose-pick-name') || '').trim();
      const tag = String($(this).attr('data-pose-pick-tag') || '').trim();
      if (!nm || !tag) return;
      shnSetPoseOverride(nm, tag);
      const $sec = $(this).closest('.shn-sub-sec');
      $sec.find('.shn-pose-in').val(tag);
      const $apply = $sec.find('.shn-pose-apply');
      $apply.addClass('shn-pose-ok').text('已应用');
      setTimeout(() => $apply.removeClass('shn-pose-ok').text('应用'), 1800);
    });
    $('.shn-pose-in').off('click').on('click', function (e) { e.stopPropagation(); });
  }

  async function init() {
    await waitOptionalGlobal('Mvu');

    applyHudSettings(await loadHudSettings());
    bindHudSettingsControls();
    applyHudTheme(loadStoredHudTheme());
    bindHudThemeControl();

    let renderedStat = null;
    function renderAll() {
      const v = getLatestStatData();
      const signature = JSON.stringify(v);
      if (signature === renderedStat) return;
      renderTopInfo(v);
      renderUserStatus(v.user);
      renderRealmTab(v.user);
      renderReputation(v.名望系统, v);
      renderWorld(v.世界运行,v);
      renderTasks(v.user?.当前任务);
      renderStore(v.系统商城,v);
      renderAssets(v.user?.名下资产,v); var bdsm = _.get(v, '调教室', {}); renderBDSM(bdsm);
      renderActiveTargets(v.当前在场互动女性, v.当前在场互动男性);
      renderRelationshipArchive(v.后宫状态, v.当前在场互动女性, v.角色追踪事件, v.女性角色档案);

      $('[data-jump-realm="1"]').off('click').on('click', function () {
        const $rTab = $('[data-target="tab-realm"]');
        if ($rTab.length && !$rTab.hasClass('is-hidden')) $rTab.trigger('click');
      });
      bindHudInteractions();

      scheduleHudFit();
      renderedStat = signature;
      return true;
    }

    renderAll();
    initCashBalanceFit();
    document.getElementById('currency-select').addEventListener('change',function(){changeCurrencyControl(renderAll)});
    autoSettleReadyTasks();
    let disposed = false, bound = false, attempts = 0;
    let refreshTimers = [];
    const listeners = [];
    // MVU notifications may precede the message write. Re-read persisted data only.
    function scheduleRefresh() {
      if (disposed) return;
      refreshTimers.forEach(clearTimeout);
      refreshTimers = [0, 100, 300, 800, 1800, 3500].map(delay => setTimeout(() => {
        if (disposed) return;
        const changed = renderAll();
        if (changed || delay === 0) autoSettleReadyTasks();
      }, delay));
    }
    function bindMvuRefresh() {
      if (disposed || bound) return bound;
      const mvu = getHudMvu();
      const on = typeof eventOn === 'function' ? eventOn : window.TavernHelper?.eventOn;
      if (!mvu?.events?.VARIABLE_UPDATE_ENDED || typeof on !== 'function') return false;
      try {
        const events = [mvu.events.VARIABLE_INITIALIZED, mvu.events.VARIABLE_UPDATE_ENDED, mvu.events.BEFORE_MESSAGE_UPDATE];
        for (const name of new Set(events.filter(Boolean))) listeners.push(on(name, scheduleRefresh));
        bound = true;
        scheduleRefresh();
      } catch (error) {
        listeners.splice(0).forEach(listener => listener?.stop?.());
        console.warn('[HUD] variable update listener unavailable:', error && error.message || error);
      }
      return bound;
    }
    bindMvuRefresh();
    const bindingTimer = setInterval(() => {
      if (bindMvuRefresh() || ++attempts >= 120) clearInterval(bindingTimer);
    }, 250);
    if (!bound && typeof waitGlobalInitialized === 'function') {
      Promise.resolve(waitGlobalInitialized('Mvu')).then(bindMvuRefresh).catch(() => {});
    }
    window.addEventListener('pagehide', () => {
      disposed = true;
      clearInterval(bindingTimer);
      refreshTimers.forEach(clearTimeout);
      if (typeof shnCloseRealmModal === 'function') shnCloseRealmModal();
      if (window.__shnLightboxKeydown) {
        document.removeEventListener('keydown', window.__shnLightboxKeydown);
        window.__shnLightboxKeydown = null;
      }
      listeners.splice(0).forEach(listener => listener?.stop?.());
    }, { once: true });

    function updateNavFades() {
      const wrap = document.getElementById('nav-tabs-wrap');
      const bar = document.getElementById('nav-tabs-render');
      if (!wrap || !bar) return;
      const maxScroll = bar.scrollWidth - bar.clientWidth;
      wrap.classList.toggle('is-fade-left', bar.scrollLeft > 4);
      wrap.classList.toggle('is-fade-right', maxScroll > 4 && bar.scrollLeft < maxScroll - 4);
    }
    function centerActiveNavTab(el) {
      const bar = document.getElementById('nav-tabs-render');
      if (!bar || !el) return;
      const targetLeft = el.offsetLeft - (bar.clientWidth - el.offsetWidth) / 2;
      try { bar.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' }); } catch (e) { bar.scrollLeft = Math.max(0, targetLeft); }
      setTimeout(updateNavFades, 260);
    }
    let navDragMoved = false;
    (function initSwipeNav() {
      const bar = document.getElementById('nav-tabs-render');
      if (!bar) return;
      let pointerDown = false, startX = 0, startLeft = 0;
      const onMove = (e) => {
        if (!pointerDown) return;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 6) navDragMoved = true;
        bar.scrollLeft = startLeft - dx;
        updateNavFades();
      };
      const onUp = () => {
        if (!pointerDown) return;
        pointerDown = false; bar.classList.remove('is-dragging');
        setTimeout(() => { navDragMoved = false; }, 30);
      };
      bar.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') return;
        pointerDown = true; navDragMoved = false;
        startX = e.clientX; startLeft = bar.scrollLeft;
        bar.classList.add('is-dragging');
      });
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      bar.addEventListener('wheel', (e) => {
        if (bar.scrollWidth <= bar.clientWidth) return;
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          e.preventDefault();
          bar.scrollLeft += e.deltaY;
          updateNavFades();
        }
      }, { passive: false });
      bar.addEventListener('scroll', updateNavFades, { passive: true });
      window.addEventListener('resize', updateNavFades);
      if (Array.isArray(listeners)) {
        listeners.push(
          { stop: () => window.removeEventListener('pointermove', onMove) },
          { stop: () => window.removeEventListener('pointerup', onUp) },
          { stop: () => window.removeEventListener('resize', updateNavFades) }
        );
      }
      setTimeout(updateNavFades, 80);
    })();

    $('.tab').on('click', function () {
      if (navDragMoved) { navDragMoved = false; return; }
      if ($(this).hasClass('is-hidden')) return;
      $('.tab').removeClass('active');
      $(this).addClass('active');
      const target = $(this).data('target');
      try { localStorage.setItem('shenhao-active-tab', target); } catch(e) {}
      $('.tab-pane').removeClass('active');
      $('#' + target).addClass('active');
      centerActiveNavTab(this);
      scheduleHudFit();
    });

    // Restore persisted tab from localStorage
    try {
      let saved = localStorage.getItem('shenhao-active-tab');
      if (saved === 'tab-realm' && !shnIsGuwuEnabled()) saved = 'tab-user';
      if (saved && document.getElementById(saved)) {
        $('.tab').removeClass('active');
        $('.tab-pane').removeClass('active');
        const $restoredTab = $('[data-target="' + saved + '"]').addClass('active');
        $('#' + saved).addClass('active');
        if ($restoredTab.length) setTimeout(() => centerActiveNavTab($restoredTab[0]), 60);
      }
    } catch(e) {}

    $(window).on('resize', function () {
      clearTimeout(window.hudResizeTimer);
      window.hudResizeTimer = setTimeout(scheduleHudFit, 100);
    });
  }

  const bootInit = typeof errorCatched === 'function' ? errorCatched(init) : init;
  if (typeof $ === 'function') {
    $(bootInit);
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootInit);
  } else {
    bootInit();
  }

  $(document).off('click.shnMingqi').on('click.shnMingqi', '[data-mq-act]', function (ev) {
    ev.preventDefault();
    ev.stopPropagation();
    var act = $(this).attr('data-mq-act');
    var nm = $(this).attr('data-mq-name');
    var api = (window.parent && window.parent.__shnMingqiApi) || window.__shnMingqiApi || null;
    if (!api || !nm) return;
    if (act === 'reveal') api.toggleReveal(nm, true);
    else if (act === 'hide') api.toggleReveal(nm, false);
    else if (act === 'force') api.toggleForce(nm);
    try {
      if (typeof renderAll === 'function') { renderAll(); }
      else if (typeof renderActiveTargets === 'function') {
        var _st = getLatestStatData();
        if (_st && typeof _st === 'object') renderActiveTargets(_st.当前在场互动女性, _st.当前在场互动男性);
      }
    } catch (e) {}
  });
</script>
